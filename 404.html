<!DOCTYPE html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — On The Roll Painters</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#4C5847">
<link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/images/favicon.png" type="image/png" sizes="512x512">
<link rel="apple-touch-icon" href="/images/apple-touch-icon.png" sizes="180x180">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--ink:#241F1A;--body:#443D35;--grey:#6B6156;--paper:#FCFBF8;--brand:#4C5847;--accent:#C58F2B}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100svh;display:grid;grid-template-rows:auto 1fr;background:var(--paper);color:var(--body);font-family:"Jost",system-ui,sans-serif;font-weight:300;font-size:1.0625rem;line-height:1.75;-webkit-font-smoothing:antialiased}
header{background:var(--brand);color:#fff;padding:1.4rem clamp(1.25rem,6vw,6rem)}
header a{display:inline-block}
header img{height:2.6rem;width:auto;display:block}
main{display:grid;place-content:center;padding:clamp(3rem,10vw,6rem) clamp(1.25rem,6vw,6rem);text-align:center}
.caps{font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--grey);margin:0 0 .75rem}
h1{font-family:"Bodoni Moda",Georgia,serif;font-weight:400;font-size:clamp(2.25rem,6vw,4rem);line-height:1.04;color:var(--ink);margin:0 0 1.25rem}
p{max-width:38ch;margin:0 auto 2rem}
.btn{font-size:.72rem;font-weight:500;letter-spacing:.16em;text-transform:uppercase;background:var(--accent);color:var(--ink);text-decoration:none;border:1px solid var(--accent);padding:.85rem 1.6rem;display:inline-block;line-height:1;transition:background .2s,color .2s,border-color .2s}
.btn:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><a href="/"><img src="/images/logo.svg" alt="On The Roll Painters" width="1580" height="368"></a></header>
<main>
  <p class="caps">404</p>
  <h1>That page isn't here.</h1>
  <p>The whole site is one page, so whatever you were after is probably on it.</p>
  <a class="btn" href="/">Back to the site</a>
</main>
</body>
</html>
